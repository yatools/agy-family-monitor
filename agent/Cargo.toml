[package]
name = "agy-family-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "AgyFamilyMonitor"
path = "src/main.rs"

[dependencies]
agy-usage-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tokio.workspace = true
notify.workspace = true
reqwest.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
chrono.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Console", "Win32_Storage_FileSystem"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_Common"] }

[dev-dependencies]
tempfile.workspace = true

